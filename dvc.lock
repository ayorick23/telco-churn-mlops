schema: '2.0'
stages:
  build_features:
    cmd: uv run python -m churn_mlops.features.build_features
    deps:
    - path: data/raw/telco.csv
      hash: md5
      md5: b2b9bfa618aa215a74e43a5f99240fd2
      size: 1932822
    - path: src/churn_mlops/data/load.py
      hash: md5
      md5: 4056c31f5a0f8561570287777bc77cc1
      size: 440
    - path: src/churn_mlops/data/schema.py
      hash: md5
      md5: d2fc467bbc192f264e8c79f58fb93085
      size: 3491
    - path: src/churn_mlops/features/build_features.py
      hash: md5
      md5: d7057b3d45b1de1bd547a3a633b3dbcd
      size: 3882
    params:
      configs/data.yaml:
        processed_dir: data/processed
        random_state: 42
        raw_path: data/raw/telco.csv
        target_column: Churn Label
        test_size: 0.2
      configs/features.yaml:
        constant_columns:
        - Country
        - State
        - Quarter
        id_columns:
        - Customer ID
        leakage_columns:
        - Churn Score
        - Customer Status
        - Churn Category
        - Churn Reason
        low_signal_columns:
        - Latitude
        - Longitude
        - Zip Code
        - CLTV
        new_customer_tenure_threshold: 12
        service_columns:
        - Online Security
        - Online Backup
        - Device Protection Plan
        - Premium Tech Support
        - Streaming TV
        - Streaming Movies
        - Streaming Music
        - Unlimited Data
        - Multiple Lines
    outs:
    - path: data/processed/test.parquet
      hash: md5
      md5: 85570671bfb56e598c459963ac2f9d77
      size: 92503
    - path: data/processed/train.parquet
      hash: md5
      md5: dc585db10d18eb901df9befa7c1349a0
      size: 256029
