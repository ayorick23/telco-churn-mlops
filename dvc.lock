              low: 15
              high: 255
            min_child_samples:
              type: int
              low: 5
              high: 100
            subsample:
              type: float
              low: 0.5
              high: 1.0
            colsample_bytree:
              type: float
              low: 0.5
              high: 1.0
            reg_alpha:
              type: float
              low: 1e-08
              high: 10.0
              log: true
            reg_lambda:
              type: float
              low: 1e-08
              high: 10.0
              log: true
        registered_model_name: churn-lightgbm
    outs:
