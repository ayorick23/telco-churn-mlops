# Configuración de Fase 4 — tuning de LightGBM con Optuna, stage `train_model`
# de dvc.yaml y registro en el MLflow Model Registry.
# Ver docs/decisions/0010-pipeline-definitivo-fase-4.md.

mlflow:
  experiment_name: phase4-training

# Nombre bajo el cual se registra cada corrida en el MLflow Model Registry
# (ADR 0010): cada `dvc repro train_model` agrega una versión nueva, sin
# promoción automática (eso es Fase 6).
registered_model_name: churn-lightgbm

# Dónde se serializa el Pipeline fiteado (preprocesador + LGBMClassifier
# tuneado), trackeado por DVC vía el stage train_model (no por git, ver
# .gitignore).
model_output_path: models/lightgbm_pipeline.pkl

# Misma columna de alta cardinalidad excluida en Fase 3 (ADR 0009): LightGBM
# usa one-hot, no soporta City nativa como CatBoost.
high_cardinality_columns:
  - City

# Hiperparámetros fijos del LGBMClassifier, NO tuneados por Optuna.
fixed_params:
  class_weight: balanced # dataset desbalanceado (ADR 0009), igual que Fase 3
  random_state: 42
  verbose: -1 # silencia logs internos de LightGBM (no de Optuna)

optuna:
  n_trials: 50 # 50 trials x 5 folds = 250 fits sobre ~5.6k filas de train
  cv_folds: 5 # Stratified K-Fold sobre train.parquet (ADR 0010)
  direction: maximize # F1 de la clase positiva, promedio entre folds
  # Espacio de búsqueda: cada entrada es {type: int|float, ...kwargs de
  # optuna.Trial.suggest_int/suggest_float}. `log: true` samplea en escala
  # logarítmica (útil para learning_rate y los términos de regularización).
  search_space:
    n_estimators:
      type: int
      low: 100
      high: 800
      step: 50
    max_depth:
      type: int
      low: 3
      high: 12
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    num_leaves:
      type: int
      low: 15
      high: 255
    min_child_samples:
      type: int
      low: 5
      high: 100
    subsample:
      type: float
      low: 0.5
      high: 1.0
    colsample_bytree:
      type: float
      low: 0.5
      high: 1.0
    reg_alpha:
      type: float
      low: 1.0e-8
      high: 10.0
      log: true
    reg_lambda:
      type: float
      low: 1.0e-8
      high: 10.0
      log: true
