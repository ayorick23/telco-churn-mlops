# Configuración de Fase 7 — dashboard (Streamlit).
# Ver docs/decisions/0013-serving-y-dashboard-fase-7.md.
# Se levanta a mano:
#   uv run streamlit run src/churn_mlops/dashboard/app.py

# Base URL de la API de Fase 7. Override vía env var CHURN_API_BASE_URL
# cuando la API esté desplegada (Fase 8) en un host distinto al dashboard.
api_base_url: http://localhost:8000

# Rutas de reportes leídas directo (no se duplican acá): reusa
# reports_dir de configs/model_selection.yaml, configs/monitoring.yaml y
# configs/registry.yaml.
report_configs:
  model_selection: configs/model_selection.yaml
  monitoring: configs/monitoring.yaml
  registry: configs/registry.yaml

# Logo mostrado arriba del sidebar (st.logo). Opcional: si el archivo no
# existe, el dashboard simplemente no muestra logo — no rompe. Colocar el
# archivo propio en esta ruta para activarlo.
logo_path: assets/logo.png

# Valor de negocio del churn (KPI "¿vale la pena retener?" en la página de
# Predicción — ver src/churn_mlops/dashboard/business_value.py). Supuestos de
# negocio, no derivados del dataset: ajustar a un caso real reemplazaría
# estos placeholders.
business_value:
  # Costo estimado de una campaña de retención (llamada, descuento, oferta)
  # por cliente. Placeholder — no viene del dataset.
  retention_campaign_cost_usd: 50.0
  # Meses del ciclo de contrato, usados para estimar cuánto valor queda
  # comprometido. Month-to-Month no tiene plazo fijo: se trata como el aviso
  # mínimo de baja (1 mes).
  contract_term_months:
    "Month-to-Month": 1
    "One Year": 12
    "Two Year": 24
