# Configuración de Fase 3 — comparación de familias de modelo.
# Ver docs/decisions/0009-comparacion-4-familias-y-encoding-por-framework.md.

mlflow:
  experiment_name: phase3-model-selection

# Métrica de selección del ganador (clase positiva = churn=1).
# accuracy/precision/recall/roc_auc/pr_auc se loguean como secundarias.
selection_metric: f1

# Alta cardinalidad (1104 valores únicos en train): se dropea en los pipelines
# basados en one-hot (LR/XGBoost/LightGBM); CatBoost la recibe nativa.
high_cardinality_columns:
  - City

# Carpeta donde se guarda la tabla comparativa + veredicto (git, no DVC).
reports_dir: reports

# Hiperparámetros por defecto/razonables (sin Optuna en esta fase, ver ADR 0009).
models:
  logistic_regression:
    max_iter: 1000
    class_weight: balanced
    random_state: 42
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.1
    eval_metric: logloss
    random_state: 42
    # scale_pos_weight NO va acá: se calcula en runtime desde y_train
    # (churn_mlops.training.preprocessing.compute_scale_pos_weight) porque es
    # un valor derivado de los datos, no un hiperparámetro fijo del modelo.
  lightgbm:
    n_estimators: 300
    max_depth: -1
    learning_rate: 0.1
    class_weight: balanced
    random_state: 42
    verbose: -1
  catboost:
    iterations: 300
    depth: 6
    learning_rate: 0.1
    auto_class_weights: Balanced
    random_seed: 42
    verbose: false
