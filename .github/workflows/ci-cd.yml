# Fase 8 (ADR 0014, actualizado 2026-08-18 — consolidación en Hugging Face
# Spaces). Dos jobs:
#   - ci: corre siempre (push y PR) — lint, format, type-check, tests, y build
#     (sin push) de ambas imágenes Docker, para detectar un Dockerfile roto
#     ANTES de mergear, no recién al desplegar. Es el status check que
#     protege main (branch protection, configurado a mano en GitHub — ver
#     docs/decisions/0014-testing-cicd-despliegue-fase-8.md).
#   - deploy: solo en push directo a main (nunca en PRs), y solo si ci pasó.
#     Publica la imagen de la API en GHCR y redespliega dos Spaces Docker de
#     Hugging Face (API y dashboard) — cada uno arma su propio árbol mínimo
#     de archivos en un directorio temporal y lo empuja force, nunca toca
#     `main` (ver la actualización del ADR 0014 para el porqué del árbol
#     mínimo en vez de pushear el repo completo).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
      - run: uv run pytest

      # Credenciales de DagsHub reusadas para el remote de DVC (mismo par
      # user/token que MLFLOW_TRACKING_USERNAME/PASSWORD, ver .env.example).
      - name: Configurar credenciales de DVC
        run: |
          uv run dvc remote modify --local origin auth basic
          uv run dvc remote modify --local origin user "${{ secrets.MLFLOW_TRACKING_USERNAME }}"
          uv run dvc remote modify --local origin password "${{ secrets.MLFLOW_TRACKING_PASSWORD }}"

      - name: Traer el champion versionado
        run: uv run dvc pull models/champion_pipeline.pkl.dvc

      - uses: docker/setup-buildx-action@v3

      - name: Build de la imagen de la API (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false

      - name: Build de la imagen del dashboard (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: false

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"
          enable-cache: true

      - run: uv sync --locked --no-dev

      # Credenciales de DagsHub reusadas para el remote de DVC (mismo par
      # user/token que MLFLOW_TRACKING_USERNAME/PASSWORD, ver .env.example).
      - name: Configurar credenciales de DVC
        run: |
          uv run dvc remote modify --local origin auth basic
          uv run dvc remote modify --local origin user "${{ secrets.MLFLOW_TRACKING_USERNAME }}"
          uv run dvc remote modify --local origin password "${{ secrets.MLFLOW_TRACKING_PASSWORD }}"

      - name: Traer el champion versionado
        run: uv run dvc pull models/champion_pipeline.pkl.dvc

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/ayorick23/telco-churn-mlops-api:latest
            ghcr.io/ayorick23/telco-churn-mlops-api:${{ github.sha }}

      # El Space de la API no construye nada: solo referencia la imagen ya
      # publicada en GHCR (pública, sin login necesario para el pull). Árbol
      # de 2 archivos armado en un dir temporal, nunca commiteado a main.
      - name: Desplegar la API en Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_API_SPACE: ${{ secrets.HF_API_SPACE }}
        run: |
          set -e
          stage=$(mktemp -d)

          echo 'FROM ghcr.io/ayorick23/telco-churn-mlops-api:latest' > "$stage/Dockerfile"

          {
            echo "---"
            echo "title: Telco Churn API"
            echo "emoji: 📡"
            echo "colorFrom: red"
            echo "colorTo: gray"
            echo "sdk: docker"
            echo "app_port: 8000"
            echo "---"
            echo
            echo "API REST de predicción de churn (FastAPI + LightGBM + SHAP)."
            echo "Imagen publicada por GitHub Actions en"
            echo '`ghcr.io/ayorick23/telco-churn-mlops-api` — este Space solo la'
            echo "despliega, no la construye desde código"
            echo "(ver docs/decisions/0014-testing-cicd-despliegue-fase-8.md)."
          } > "$stage/README.md"

          cd "$stage"
          git init -q
          git checkout -q -b main
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" add -A
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" commit -q -m "Deploy ${{ github.sha }}"
          git push --force "https://ayorick23:${HF_TOKEN}@huggingface.co/spaces/${HF_API_SPACE}" HEAD:main

      # El Space del dashboard sí construye su propia imagen — se le manda
      # solo el contexto real que docker/dashboard.Dockerfile necesita (ese
      # mismo Dockerfile, copiado a la raíz porque el SDK Docker de HF
      # Spaces exige el archivo ahí, no soporta una ruta custom).
      - name: Desplegar el dashboard en Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DASHBOARD_SPACE: ${{ secrets.HF_DASHBOARD_SPACE }}
        run: |
          set -e
          stage=$(mktemp -d)

          cp -r pyproject.toml uv.lock src configs reports "$stage/"
          cp docker/dashboard.Dockerfile "$stage/Dockerfile"

          {
            echo "---"
            echo "title: Telco Churn Dashboard"
            echo "emoji: 📊"
            echo "colorFrom: blue"
            echo "colorTo: red"
            echo "sdk: docker"
            echo "app_port: 8501"
            echo "---"
            echo
            cat README.md
          } > "$stage/README.md"

          cd "$stage"
          git init -q
          git checkout -q -b main
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" add -A
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" commit -q -m "Deploy ${{ github.sha }}"
          git push --force "https://ayorick23:${HF_TOKEN}@huggingface.co/spaces/${HF_DASHBOARD_SPACE}" HEAD:main
