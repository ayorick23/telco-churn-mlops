stages:
  build_features:
    cmd: uv run python -m churn_mlops.features.build_features
    deps:
      - data/raw/telco.csv
      - src/churn_mlops/data/schema.py
      - src/churn_mlops/data/load.py
      - src/churn_mlops/features/build_features.py
    params:
      - configs/data.yaml:
      - configs/features.yaml:
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet

  train_model:
    cmd: uv run python -m churn_mlops.training.run_training
    deps:
      - data/processed/train.parquet
      - data/processed/test.parquet
      - src/churn_mlops/training/dataset.py
      - src/churn_mlops/training/preprocessing.py
      - src/churn_mlops/training/model_specs.py
      - src/churn_mlops/training/evaluation.py
      - src/churn_mlops/training/tuning.py
      - src/churn_mlops/training/run_training.py
    params:
      - configs/data.yaml:
      - configs/training.yaml:
    outs:
      - models/lightgbm_pipeline.pkl
      - models/best_params.json
